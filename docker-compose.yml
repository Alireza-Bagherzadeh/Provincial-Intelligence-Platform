services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: semnan
      POSTGRES_USER: semnan
      POSTGRES_PASSWORD: semnan
    ports:
      - "5434:5432"
    volumes:
      - semnan_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    depends_on:
      - db
      - redis
    environment:
      POSTGRES_DB: semnan
      POSTGRES_USER: semnan
      POSTGRES_PASSWORD: semnan
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      MANAGEMENT_API_TOKEN: ${MANAGEMENT_API_TOKEN:-semnan-local-dev-token}
    ports:
      - "9000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      SEMNAN_API_URL: http://backend:8000/graphql/
      SEMNAN_BACKEND_URL: http://backend:8000
      MANAGEMENT_API_TOKEN: ${MANAGEMENT_API_TOKEN:-semnan-local-dev-token}
      NEXT_PUBLIC_SEMNAN_ADMIN_URL: http://localhost:9000/admin/
    ports:
      - "3000:3000"

volumes:
  semnan_pg:
